services:
  filmorate-backend:
    build: .
    container_name: filmorate-backend

    ports:
      - "8082:8080"

    environment:
      DB_URL: jdbc:h2:file:/app/db/filmorate
      DB_USERNAME: dbadmin
      DB_PASSWORD: 1

    volumes:
      - filmorate-db:/app/db

    restart: unless-stopped

volumes:
  filmorate-db: