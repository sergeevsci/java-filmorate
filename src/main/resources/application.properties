spring.jackson.serialization.write-durations-as-timestamps=true
logging.level.org.zalando.logbook=TRACE

spring.sql.init.mode=always

spring.datasource.url=jdbc:h2:file:/app/db/filmorate
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:dbadmin}
spring.datasource.password=${DB_PASSWORD:1}
